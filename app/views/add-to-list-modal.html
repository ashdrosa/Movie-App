<div class="modal" tabindex="-1" id="add-to-list-modal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add To List</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <p>Add to List:</p>

        <check if="{{isset(@SESSION.user_id) && @movieLists != NULL}}">
          <true>
            <form id="add-to-list-form">
              <select name="movie_list" id="add-to-list-form-selection">
                <repeat group="{{@movieLists}}" value="{{@list}}">
                  <option class="movie-list-name" value="{{@list.id}}">
                    {{@list.list_name ?? ""}}
                  </option>
                </repeat>
              </select>
              <input name="movie_id" type="number" hidden id="movie-id-input"  />
            </form>
          </true>
          <false>
            <p>No List Found, Create your list now!</p>
          </false>
        </check>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Close
        </button>
        <button
          type="button"
          class="btn btn-primary"
          id="add-to-list-submit-btn"
        >
          Add
        </button>
      </div>
    </div>
  </div>
</div>
