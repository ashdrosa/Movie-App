<include href="header.html" />

<body>
  <div class="nav-bar">
    <div class="Logo">Movie Locker</div>
    <div class="user-info">
      <check if="{{isset(@SESSION.user_id ) }}">
        <true>Hi, {{@SESSION.user_name}}</true>
        <false>
          <a href="/login"> Login </a>
          or
          <a href="/register"> Sign Up </a>
        </false>
      </check>
    </div>
  </div>
  <div class="title-header">
    <h1>SEARCH FOR A MOVIE OR SHOW</h1>
  </div>
  <div class="search-section">
    <div id="input name">
      <input type="text" id="movie-search-txt" />
      <button type="click" id="btn-submit-search">SUBMIT</button>
    </div>
    <!-- Search Results Section  (Movie Cards)-->
    <div id="srch-results"></div>
  </div>
  <!-- Side Bar of Lists  -->
  <div class="side-bar">
    <h2>MY LISTS</h2>
    <button id="btn-create-movie-list">+</button>
    <form id="create-movie-list-form">
      <input
        name="list_name"
        type="text"
        id="movie-list-name"
        placeholder="Enter list name"
      />
      <button type="click" id="btn-submit-movie-list">Create</button>
    </form>
    <!-- Movie Lists Section -->
    <div id="movie-lists">
      <ul>
        <!-- Conditional for showing session Users list or not -->
        <check if="{{isset(@SESSION.user_id) && @movieLists != NULL}}">
          <true>
            <p>You have a list!!!! Wait tho not coded yet</p>
            <repeat group="{{@movieLists}}" value="{{@list}}">
              <li class="movie-list-name">{{@list.list_name ?? ""}}</li>
            </repeat>
          </true>
          <false>
            <p>No List Found, Create your list now!</p>
          </false>
        </check>
      </ul>
    </div>
  </div>
  <include href="add-to-list-modal.html" />
</body>

<style>
  h6 {
    color: red;
    text-align: center;
  }

  .search-section {
    width: 70%;
    height: 100vh;
    float: left;
  }

  #srch-results {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 20px;
  }

  .side-bar {
    width: 30%;
    height: 100vh;
    float: right;
    background-color: #b1bdff;
  }

  #create-movie-list-form {
    display: none;
  }

  .add-to-list-btn {
    font-size: 15px;
    display: flex;
  }
</style>

<script>
  var submitBtn = document.getElementById("btn-submit-search");
  var srchBox = document.getElementById("movie-search-txt");

  submitBtn.addEventListener("click", async () => {
    console.log("You CLicked the Butt");

    var srchWord = srchBox.value;

    console.log(srchWord);

    const options = {
      method: "GET",
      headers: {
        accept: "application/json",
        Authorization: TMDB_API_KEY,
      },
    };

    await fetch(
      "https://api.themoviedb.org/3/search/movie?query=" +
        srchWord +
        "&include_adult=false&language=en-US&page=1",
      options,
    )
      .then((res) => res.json())
      .then((res) => {
        //console.log(res);

        const searchResults = document.getElementById("srch-results");

        searchResults.innerHTML = "";

        var movieResults = res.results;

        movieResults.forEach((movie) => {
          console.log(movie.title);
          let movieCard = document.createElement("div");
          movieCard.className = "movie-card";

          var movieTitle = document.createElement("h6");
          movieTitle.textContent = movie.title;

          var movieImg = document.createElement("img");
          movieImg.src = "https://image.tmdb.org/t/p/w200" + movie.poster_path;

          var addToListBtn = document.createElement("button");
          addToListBtn.className = "add-to-list-btn";
          addToListBtn.textContent = "+";
          addToListBtn.setAttribute("data-bs-target", "#add-to-list-modal");
          addToListBtn.setAttribute("data-bs-toggle", "modal");

          addToListBtn.addEventListener("click", async (e) => {
            e.preventDefault();
            console.log(
              "Clicked add to list Btn - this movie is in your list now!",
            );
            var addToListModal = document.getElementById("add-to-list-modal");
            var formMovieIdInput = document.getElementById("movie-id-input");
            formMovieIdInput.value = movie.id;
          });

          movieCard.appendChild(movieImg);
          movieCard.appendChild(movieTitle);
          movieCard.appendChild(addToListBtn);
          searchResults.appendChild(movieCard);
        });
      })
      .catch((err) => console.error(err));
  });

  let createMovieListBtn = document.getElementById("btn-create-movie-list");
  let createMovieListForm = document.getElementById("create-movie-list-form");
  let submitMovieListBtn = document.getElementById("btn-submit-movie-list");
  let movieListNameInput = document.getElementById("movie-list-name");

  // createMovieListForm.style.display = "none";

  createMovieListBtn.addEventListener("click", () => {
    createMovieListForm.style.display = "block";
  });

  submitMovieListBtn.addEventListener("click", async (e) => {
    e.preventDefault();
    console.log("clicked create User Movie List");
    console.log(movieListNameInput.value);
    const response = await fetch("/create/movie/list", {
      method: "POST",
      body: new FormData(createMovieListForm),
    });

    const result = await response.json();
    console.log(result.success);
    console.log(result.message);
    if (result.success == true) {
      // window.location.href = "/";
    }
  });

  let addToListSubmitBtn = document.getElementById("add-to-list-submit-btn");

  addToListSubmitBtn.addEventListener("click", async (e) => {
    e.preventDefault();
    let addToListForm = document.getElementById("add-to-list-form");
    let formSelection = document.getElementById("add-to-list-form-selection");
    let selectedList = formSelection.value;
    let selectedListTitle =
      formSelection.options[formSelection.selectedIndex].textContent;
    console.log("Added to list:" + selectedListTitle);

    //Fetch Request // URL PARAM
    const response = await fetch("/list/" + selectedList + "/add/movie", {
      method: "POST",
      body: new FormData(addToListForm),
    });

    const result = await response.json();
    console.log(result.success);
    console.log(result.message);
    if (result.success == true) {
      // window.location.href = "/";
    }
  });
</script>
