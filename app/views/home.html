<include href="header.html" />

<body>
  <div class="nav-bar">
    <div class="Logo">Movie Locker</div>
    <div class="user-info">
      <check if="{{isset(@SESSION.user_id ) }}">
        <true>Hi, {{@SESSION.user_name}}</true>
        <false>
          <a href="/login"> Login </a>
          or
          <a href="/register"> Sign Up </a>
        </false>
      </check>
    </div>
  </div>
  <div class="title-header">
    <h1>SEARCH FOR A MOVIE OR SHOW</h1>
  </div>
  <div class="search-section">
    <div id="input name">
      <input type="text" id="movie-search-txt" />
      <button type="click" id="btn-submit-search">SUBMIT</button>
    </div>

    <div id="srch-results"></div>
  </div>
  <div class="side-bar">
    <h2>MY LISTS</h2>
  </div>
</body>

<style>
  h6 {
    color: red;
    text-align: center;
  }

  .search-section {
    width: 70%;
    height: 100vh;
    float: left;
  }

  #srch-results {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 20px;
  }

  .side-bar {
    width: 30%;
    height: 100vh;
    float: right;
    background-color: #b1bdff;
  }
</style>

<script>
  var submitBtn = document.getElementById("btn-submit-search");
  var srchBox = document.getElementById("movie-search-txt");

  submitBtn.addEventListener("click", async () => {
    console.log("You CLicked the Butt");

    var srchWord = srchBox.value;

    console.log(srchWord);

    const options = {
      method: "GET",
      headers: {
        accept: "application/json",
        Authorization: TMDB_API_KEY,
      },
    };

    await fetch(
      "https://api.themoviedb.org/3/search/movie?query=" +
        srchWord +
        "&include_adult=false&language=en-US&page=1",
      options,
    )
      .then((res) => res.json())
      .then((res) => {
        console.log(res);

        const searchResults = document.getElementById("srch-results");

        searchResults.innerHTML = "";

        var movieResults = res.results;
        movieResults.forEach((movie) => {
          console.log(movie.title);
          let movieCard = document.createElement("div");
          movieCard.className = "movie-card";

          var movieTitle = document.createElement("h6");
          movieTitle.textContent = movie.title;
          var movieImg = document.createElement("img");
          movieImg.src = "https://image.tmdb.org/t/p/w200" + movie.poster_path;

          movieCard.appendChild(movieImg);
          movieCard.appendChild(movieTitle);
          searchResults.appendChild(movieCard);
        });
      })
      .catch((err) => console.error(err));
  });
</script>
